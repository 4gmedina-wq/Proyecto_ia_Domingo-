<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Core Dinámico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Panel Lateral -->
        <aside class="sidebar">
            <h2>⚙ Parámetros IA</h2>
            <div class="control-group">
                <label>Temperatura: <span id="tempVal" style="color:var(--accent);">0.2</span></label>
                <input type="range" id="temperature" min="0.1" max="1.0" step="0.1" value="0.2" oninput="document.getElementById('tempVal').innerText=this.value">
            </div>
            <div class="control-group">
                <label>Modelo:</label>
                <input type="text" value="deepseek-r1:1.5b" disabled>
            </div>

            <h2>🔊 Voz Interactiva</h2>
            <div class="voice-status-box">
                <button class="voice-toggle active" id="voiceToggle" onclick="toggleVoz()">Voz: Activada</button>
                <div class="control-group" style="margin-top: 10px;">
                    <label>Voz del Sistema:</label>
                    <select id="voiceSelect" style="background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 6px; border-radius: 6px; font-size: 0.8rem;"></select>
                </div>
            </div>
        </aside>

        <!-- Sección Principal -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="status-indicator">
                    <!-- Animación HTML5: Núcleo Arc Reactor Cibernético en movimiento -->
                    <div class="arc-reactor">
                        <div class="core-ring"></div>
                    </div>
                    <span>J.A.R.V.I.S. // Core Activo</span>
                </div>
            </header>

            <!-- Contenedor de mensajes con scroll independiente y altura fija controlada -->
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">Sistemas en línea. Listo, señor.</div>
            </div>

            <div class="loading" id="loadingIndicator">
                <span>Procesando instrucción...</span>
            </div>

            <!-- Área de input fija que nunca desaparecerá -->
            <div class="chat-input-area">
                <button class="mic-btn" id="micBtn" onclick="toggleMicrofono()" title="Hablar">🎙️</button>
                <textarea id="userInput" placeholder="Escribe tu orden o comando..." rows="1" onkeydown="handleKey(event)"></textarea>
                <button class="action-btn" onclick="enviarMensaje()">Enviar</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
